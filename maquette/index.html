<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cercle de Confiance - Un espace d'écoute et de médiation pour la communauté scolaire">
  <title>Connexion | Cercle de Confiance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-icon"><img src="Logo_VLB.svg" /></div>
      <br>
      <h1 class="login-title">Cercle de Confiance</h1>
      <p class="login-subtitle">Entrez le code d'accès affiché dans votre établissement</p>
      
      <form id="loginForm" action="#" method="post">
        <div class="form-group">
          <label for="secretCode" class="sr-only">Code d'accès</label>
          <input 
            type="text" 
            id="secretCode" 
            name="code" 
            placeholder="Code d'accès"
            autocomplete="off"
            required
          >
        </div>
        
        <button type="submit" class="btn btn-primary login-btn">
          Accéder
        </button>
      </form>
      
      <div class="login-footer">
        <a href="membre-login.html">Membres du Cercle ? Connectez-vous ici</a>
      </div>
      
      <p class="login-note">
        Ce site est réservé aux membres de la communauté scolaire
      </p>
    </div>
  </main>
  
  <script src="script.js"></script>

</body>
</html>
